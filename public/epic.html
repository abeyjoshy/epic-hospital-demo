<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Epic Hospital System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header>
  <h1>&#127973; Epic Hospital System</h1>
  <div class="doctor-info" id="doctorInfo" style="display:none;">
    <span id="doctorName"></span>
    <button id="connectSphereBtn">SPHERE: Not Connected</button>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<div id="sphereModal" class="modal-overlay" style="display:none;">
  <div class="modal-box modal-box-lg">
    <button class="modal-close" id="closeSphereModalBtn">&times;</button>
    <iframe id="sphereFrame" src="http://localhost:3000/widget.html?origin=http://localhost:4000"></iframe>
  </div>
</div>

<div id="addPatientModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <button class="modal-close" id="closeAddPatientModalBtn">&times;</button>
    <h3 class="section-title">Add New Patient</h3>
    <div class="add-form">
      <input type="text" id="newPatientFirstName" placeholder="First name" />
      <input type="text" id="newPatientLastName" placeholder="Last name" />
      <input type="date" id="newPatientDob" />
      <select id="newPatientSex">
        <option value="">Sex</option>
        <option value="M">M</option>
        <option value="F">F</option>
      </select>
      <input type="text" id="newPatientPhone" placeholder="Phone (optional)" />
      <input type="text" id="newPatientPpsn" placeholder="PPSN (optional)" />
      <button id="addPatientBtn">Add Patient</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none;"></div>

<div class="container">

  <div id="loginSection">
    <div class="card login-card">
      <h2>Doctor Login</h2>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button id="loginBtn" style="width:100%; margin-top:6px;">Login</button>
      <p class="error-text" id="loginError"></p>
    </div>
  </div>

  <div id="appSection" class="app-shell" style="display:none;">
    <div class="home-toolbar">
      <input type="text" id="searchInput" placeholder="Search by name or MRN" />
      <button id="searchBtn">Search</button>
      <button id="openAddPatientModalBtn">+ New Patient</button>
    </div>
    <div class="home-list-panel">
      <ul class="patient-list" id="patientList"></ul>
    </div>
    <div class="pagination">
      <button class="secondary" id="prevBtn">Previous</button>
      <span id="pageInfo"></span>
      <button class="secondary" id="nextBtn">Next</button>
    </div>
  </div>

  <div id="patientDetail" class="app-shell" style="display:none;">
    <div class="detail-topbar">
      <button class="back-link" id="backBtn">&larr; Back</button>
      <div class="detail-topbar-info">
        <h2 id="detailName"></h2>
        <p id="detailInfo"></p>
      </div>
      <div class="detail-topbar-actions">
        <button class="secondary" id="accessSphereBtn">Access SPHERE Data</button>
        <button class="secondary" id="syncSphereBtn">Sync to SPHERE</button>
      </div>
    </div>

    <div class="detail-columns">
      <div class="detail-col-left">
        <div class="card">
          <h3 class="section-title">New Visit</h3>
          <input type="text" id="visitDiagnosis" placeholder="Diagnosis (e.g. Fever)" />
          <textarea id="visitNote" placeholder="Clinical notes for this visit..."></textarea>

          <div id="visitMedRows"></div>
          <button type="button" class="secondary" id="addMedRowBtn" style="margin-top:8px;">+ Add Medication</button>

          <button id="saveVisitBtn" style="margin-top: 12px;">Save Visit</button>
        </div>
      </div>

      <div class="detail-col-right">
        <div class="card detail-history-card">
          <div class="card-header-row">
            <h3 class="section-title">Patient History</h3>
            <button class="secondary" id="viewFullHistoryBtn">View Detailed History</button>
          </div>
          <ul class="record-list" id="detailHistory"></ul>
        </div>

        <div class="card detail-allergy-card">
          <div class="card-header-row">
            <h3 class="section-title">Allergies</h3>
            <button class="secondary" id="openAddAllergyBtn">+ Add</button>
          </div>
          <ul class="record-list" id="detailAllergies"></ul>

          <div id="addAllergyForm" class="add-form" style="display:none; margin-top: 10px;">
            <input type="text" id="newAllergySubstance" placeholder="Substance (e.g. Penicillin)" />
            <input type="text" id="newAllergyReaction" placeholder="Reaction" />
            <input type="text" id="newAllergyNote" placeholder="Note (optional)" />
            <button id="addAllergyBtn">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="patientHistoryFull" class="app-shell" style="display:none;">
    <div class="detail-topbar">
      <button class="back-link" id="backToPatientBtn">&larr; Back to Patient</button>
      <div class="detail-topbar-info">
        <h2 id="fullHistoryName"></h2>
        <p id="fullHistoryInfo"></p>
      </div>
    </div>

    <div class="full-history-columns">
      <div class="card full-history-timeline">
        <h3 class="section-title">Full Medical Timeline</h3>
        <ul class="record-list" id="fullHistoryList"></ul>
      </div>

      <div class="card full-history-allergies">
        <h3 class="section-title">Allergies</h3>
        <ul class="record-list" id="fullHistoryAllergies"></ul>
      </div>
    </div>
  </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
