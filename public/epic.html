<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Epic Hospital System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header>
  <h1>&#127973; Epic Hospital System</h1>
  <div class="doctor-info" id="doctorInfo" style="display:none;">
    <span id="doctorName"></span>
    <span id="sphereStatus" class="sphere-status disconnected">SPHERE: Not Connected</span>
    <button class="secondary" id="connectSphereBtn">Connect SPHERE</button>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<div id="sphereModal" class="sphere-modal-overlay" style="display:none;">
  <div class="sphere-modal-box">
    <button class="sphere-modal-close" id="closeSphereModalBtn">&times;</button>
    <iframe id="sphereFrame" src="http://localhost:3000/widget.html"></iframe>
  </div>
</div>

<div class="container">

  <div id="loginSection">
    <div class="card login-card">
      <h2>Doctor Login</h2>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button id="loginBtn" style="width:100%; margin-top:6px;">Login</button>
      <p class="error-text" id="loginError"></p>
    </div>
  </div>

  <div id="appSection" style="display:none;">
    <div class="card">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search by name or MRN" />
        <button id="searchBtn">Search</button>
      </div>
      <ul class="patient-list" id="patientList"></ul>
      <div class="pagination">
        <button class="secondary" id="prevBtn">Previous</button>
        <span id="pageInfo"></span>
        <button class="secondary" id="nextBtn">Next</button>
      </div>
    </div>
  </div>

  <div id="patientDetail" style="display:none;">
    <button class="back-link" id="backBtn">&larr; Back to patient list</button>

    <div class="card patient-header">
      <h2 id="detailName"></h2>
      <p id="detailInfo"></p>
    </div>

    <div class="card">
      <h3 class="section-title">New Visit</h3>
      <input type="text" id="visitDiagnosis" placeholder="Diagnosis (e.g. Fever)" />
      <textarea id="visitNote" rows="5" placeholder="Clinical notes for this visit..."></textarea>

      <div class="add-form" style="margin-top: 12px;">
        <input type="text" id="visitMedName" placeholder="Medication (optional)" />
        <input type="text" id="visitMedDosage" placeholder="Dosage" />
        <input type="text" id="visitMedFrequency" placeholder="Frequency" />
      </div>

      <button id="saveVisitBtn" style="margin-top: 12px;">Save Visit</button>
    </div>

    <div class="card">
      <h3 class="section-title">Allergies</h3>
      <ul class="record-list" id="detailAllergies"></ul>
    </div>

    <div class="card">
      <div class="history-header">
        <h3 class="section-title">Patient History</h3>
        <button class="secondary" id="toggleHistoryBtn">Show History</button>
      </div>
      <ul class="record-list" id="detailHistory" style="display:none; margin-top: 10px;"></ul>
    </div>
  </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
